<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kontakt - Maurus Graf</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="page-wrapper">
    <header>
        <div class="title">Kontakt</div>
        <nav>
            <a href="index.html">Über mich</a>
            <a href="faehigkeiten.html">Fähigkeiten</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
    </header>

    <div class="content">
        <div>
            <p><strong>E-Mail</strong><br>maurus.graf@edu.gbssg.ch</p>
            <p><strong>Telefon</strong><br>079 797 1099</p>
        </div>
        <img src="KoerperPhoto.JPG" alt="Portrait von Maurus Graf" class="portrait">
    </div>

    <div class="contact-form-wrapper">
        <form action="#" method="post" class="contact-form">
            <label for="name"><strong>Name</strong></label><br>
            <input type="text" id="name" name="name" placeholder="Ihr Name" required><br><br>

            <label for="email"><strong>E-Mail</strong></label><br>
            <input type="email" id="email" name="email" placeholder="Ihre E-Mail-Adresse" required><br><br>

            <label for="message"><strong>Nachricht</strong></label><br>
            <textarea id="message" name="message" rows="5" placeholder="Ihre Nachricht" required></textarea><br><br>

            <div class="contact-form-buttons">
                <button type="submit">Absenden</button>
                <button type="reset">Zurücksetzen</button>
            </div>
        </form>
    </div>

    <footer>Erstellt von Maurus Graf</footer>
</div>
</body>
</html>
